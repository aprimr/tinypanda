[build]
  base = "website"
  command = "npm run build"
  publish = "build"

[[headers]]
  for = "/binaries/*.wasm"
  [headers.values]
    Content-Type = "application/wasm"
    Cache-Control = "public, max-age=31536000, immutable"


[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false 